name: Engineering checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      DEMO_PASSWORD: test-only-password-123
      JOB_MODE: inline
      APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: alembic upgrade head && python -m app.seed
        working-directory: backend
      - run: uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/gridmind-api.log 2>&1 &
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm run start > /tmp/gridmind-web.log 2>&1 &
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-traces, path: frontend/test-results}
  compose:
    runs-on: ubuntu-latest
    env:
      DEMO_PASSWORD: test-only-password-123
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 240
      - run: curl --fail http://localhost:3000/api/health
      - run: python scripts/smoke.py
      - if: always()
        run: docker compose logs && docker compose down -v
